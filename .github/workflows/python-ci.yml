name: Python Grade Calculator CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Execute calculator
        run: |
          printf "80 90 100\n" | python calculator.py

      - name: Run Flake8
        run: flake8 calculator.py tests

      - name: Run Pytest
        run: pytest -v
